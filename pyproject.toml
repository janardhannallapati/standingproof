[project]
name = "standingproof"
version = "0.1.0"
description = "Answers security questionnaires from approved sources, verifies them against live settings, and reopens them when those settings drift."
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "Janardhan Nallapati" }]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "anthropic>=2.8.0",
    "asyncpg>=0.32.0",
    "defusedxml>=0.7.1",
    "fastapi>=0.162.5",
    "openpyxl>=3.1.5",
    "pydantic-settings>=2.16.2",
    "python-multipart>=0.0.33",
    "redis>=8.1.0",
    "sqlalchemy[asyncio]>=2.1.8",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.12.3,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "ruff>=0.17.4",
    "testcontainers[postgres,redis]>=4.15.0",
    "types-openpyxl>=3.1.5.20261017",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# A warning is a defect we have not looked at yet, so it fails the run.
filterwarnings = ["error"]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# E/F: pycodestyle and pyflakes. I: import order. UP: modern syntax. B: likely bugs.
# S: security checks (bandit). ASYNC: blocking calls inside async code.
select = ["E", "F", "I", "UP", "B", "S", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.mypy]
strict = true
files = ["src"]
