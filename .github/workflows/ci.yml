name: ci

on:
  push:
    branches: [main]
  pull_request:

# The workflow token can read the repository and nothing else.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Actions are pinned to a commit hash, not a tag: a tag can be moved, a hash cannot.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - name: Install
        run: uv sync --frozen
      - name: Lint
        run: uv run ruff check .
      - name: Format check
        run: uv run ruff format --check .
      - name: Type check
        run: uv run mypy
      - name: Test
        run: uv run pytest -v

  # Builds the image that ships and proves it starts. The test job runs from source, so
  # without this a change that only breaks the image would pass.
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The image and the tests use one Python version
        run: grep -q "^FROM python:$(cat .python-version)-slim AS runtime" Dockerfile
      - name: Build and start
        run: docker compose up --build --detach --wait --wait-timeout 180
      - name: Liveness and readiness
        run: |
          curl --fail --silent --show-error --max-time 10 http://127.0.0.1:8000/healthz
          curl --fail --silent --show-error --max-time 10 http://127.0.0.1:8000/readyz
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color
