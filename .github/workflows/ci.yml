name: ci

on:
  push:
    branches: [main]
  pull_request:

# The workflow token can read the repository and nothing else.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Actions are pinned to a commit hash, not a tag: a tag can be moved, a hash cannot.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - name: Install
        run: uv sync --frozen
      - name: Lint
        run: uv run ruff check .
      - name: Format check
        run: uv run ruff format --check .
      - name: Type check
        run: uv run mypy
      - name: Test
        run: uv run pytest -v

  # The tests marked `slow`: retrieval scores with the real embedding model, and a run
  # that survives a worker process being killed.
  retrieval:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - name: Install
        run: uv sync --frozen
      - name: Retrieval quality on the golden set; a killed worker loses nothing
        run: uv run pytest -m slow -s -v

  # The reviewer's screen: lint, types, component tests, a production build.
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    env:
      # The framework reports anonymous usage to its vendor unless told not to.
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Enable pnpm at the version in package.json
        run: corepack enable
      # The lockfile is the only source of versions. Install scripts of dependencies do
      # not run unless the project allows them by name, and it allows none.
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: The committed API types match the committed OpenAPI document
        run: pnpm gen:api && git diff --exit-code -- src/lib/api-types.ts
      - name: Lint
        run: pnpm lint
      - name: Type check
        run: pnpm typecheck
      - name: Test
        run: pnpm test
      - name: Build
        run: pnpm build
      - name: Nothing sent to the browser holds a secret or an internal address
        run: |
          ! grep -rIlE "sk-ant-|ANTHROPIC_API_KEY|github_pat_|AKIA[0-9A-Z]{16}|API_URL|api:8000|SP_DATABASE_URL" .next/static

  # Builds the image that ships and proves it starts. The test job runs from source, so
  # without this a change that only breaks the image would pass.
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The image and the tests use one Python version
        run: grep -q "^FROM python:$(cat .python-version)-slim AS runtime" Dockerfile
      - name: Build and start
        run: docker compose up --build --detach --wait --wait-timeout 180
      - name: Liveness and readiness
        run: |
          curl --fail --silent --show-error --max-time 10 http://127.0.0.1:8000/healthz
          curl --fail --silent --show-error --max-time 10 http://127.0.0.1:8000/readyz
      - name: The baked-in model embeds and search finds by meaning, with no network to the hub
        run: |
          curl --fail --silent --show-error --max-time 60 -X POST http://127.0.0.1:8000/library/answers \
            -H 'content-type: application/json' \
            -d '{"question":"Is multi-factor authentication required for employees?","answer":"Yes, for all employee accounts.","owner":"ci","expires_on":"2099-01-01"}'
          curl --fail --silent --show-error --max-time 60 --get http://127.0.0.1:8000/library/search \
            --data-urlencode 'q=Do you enforce 2FA for staff?' | tee /dev/stderr | grep -q '"meaning"'
      - name: The worker is running and the saved-state tables exist
        run: |
          docker compose ps --status running --services | grep -qx worker
          docker compose exec -T postgres psql -U standingproof -d standingproof -tAc \
            "SELECT count(*) FROM information_schema.tables WHERE table_schema = 'workflow'" | grep -qv '^0$'
      - name: A run on an unknown questionnaire is refused, so the route is wired
        run: |
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' --max-time 10 -X POST \
            http://127.0.0.1:8000/questionnaires/00000000-0000-0000-0000-000000000000/runs)" = 404
      - name: The reviewer's screen is served
        run: curl --fail --silent --show-error --max-time 10 http://127.0.0.1:3000/healthz
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      # The whole path in a real browser, against the stack above. No model key: answers
      # that match the library exactly are enough to approve, edit and reject.
      - name: End to end in a browser, with an accessibility check
        working-directory: web
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium
          pnpm e2e
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color
