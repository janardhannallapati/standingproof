version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    # Wait a week before proposing a new release, so a compromised version is likely
    # to be caught and pulled first.
    cooldown:
      default-days: 7
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    # The Python version is chosen by hand and is the same in .python-version, so the
    # image and the tests always run one version. Patch releases still arrive.
    ignore:
      - dependency-name: python
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
