version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    # Wait a week before proposing a new release, so a compromised version is likely
    # to be caught and pulled first.
    cooldown:
      default-days: 7
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    # The Python version is chosen by hand and is the same in .python-version, so the
    # image and the tests always run one version. Patch releases still arrive.
    ignore:
      - dependency-name: python
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  # The web app. Grouped, so a week's updates arrive as one pull request.
  - package-ecosystem: "npm"
    directory: "/web"
    schedule:
      interval: "weekly"
    # The same week's wait as for Python packages.
    cooldown:
      default-days: 7
    groups:
      web:
        patterns: ["*"]
    ignore:
      # The types must describe the Node that runs the code: same major as web/Dockerfile
      # and the CI workflow. Changed by hand, together with them.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # TypeScript 7 is the native compiler and has no JavaScript API. openapi-typescript,
      # which generates src/lib/api-types.ts, calls that API and fails to start on it.
      # Remove this when openapi-typescript supports TypeScript 7.
      - dependency-name: typescript
        versions: [">=7"]
  - package-ecosystem: docker
    directory: /web
    schedule:
      interval: weekly
    # The Node version is chosen by hand and is the same here, in the CI workflow and in
    # @types/node. The node:26 image has no corepack, which the image and CI use to
    # get pnpm, so a new major is a change to all three. Node 22 is supported until April
    # 2027. Patch and minor releases of the image still arrive.
    ignore:
      - dependency-name: node
        update-types: ["version-update:semver-major"]
